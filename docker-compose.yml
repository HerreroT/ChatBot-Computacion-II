version: "3.9"

services:
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: mysql+asyncmy://app:app@mysql:3306/barber_bot
      APP_BOOKING_CONCURRENCY: 8
      APP_BOOKING_SLOT_MINUTES: 30
      APP_TIMEZONE: America/Argentina/Mendoza
    ports:
      - "8000:8000"
    command: >
      bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barber_bot
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

volumes:
  mysql_data:
