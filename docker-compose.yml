version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: barber_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: barber
      MYSQL_USER: barber_user
      MYSQL_PASSWORD: barber_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barber_api
    ports:
      - "8000:8000"
    environment:
      DB_URL: "mysql+aiomysql://root:password@db:3306/barber"
      TZ: "America/Argentina/Buenos_Aires"
      CONCURRENCY_PER_SLOT: "3"
      LOCAL_SEMAPHORE_SIZE: "100"
      LOG_LEVEL: "INFO"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop asyncio
      "

volumes:
  mysql_data:




